name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi  # requires PyPI trusted-publisher setup (repo Settings → Environments)
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv pip install -e ".[dev]"   # setup-uv provides the venv
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv build
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish
