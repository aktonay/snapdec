name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi  # requires PYPI trusted-publisher setup (repo Settings → Environments)
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv python install 3.10 3.11 3.12 3.13 && uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv build
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish
