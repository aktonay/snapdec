name: debug-macos
on: workflow_dispatch

jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv pip install -e ".[dev]"
      - name: Reproduce daemon start exactly as the test does
        run: |
          export SNAPDEC_HOME="$(mktemp -d)/home"
          echo "SNAPDEC_HOME=$SNAPDEC_HOME"
          echo "PATH-snapdec: $(which snapdec || echo none)"
          uv run python - <<'PY'
          import os, sys, time
          from snapdec import config
          from snapdec.runtime.lifecycle import start_daemon, stop_daemon, daemon_status
          config.Config(backend="mock").save()
          t0=time.time()
          ok = start_daemon(wait_seconds=15)
          print("start_daemon ->", ok, f"{time.time()-t0:.1f}s")
          print("status:", daemon_status())
          import pathlib
          logdir = config.logs_dir()
          for f in sorted(logdir.glob("*")):
              print(f"--- {f} ---")
              print(f.read_text(errors="replace")[:3000])
          st = config.state_dir()
          for f in sorted(st.glob("*")):
              print(f"--- {f} ---")
              print(f.read_text(errors="replace")[:500])
          stop_daemon()
          PY
