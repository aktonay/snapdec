[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapdec"
dynamic = ["version"]
description = "Snap decisions for coding agents: one command wires a local or hosted System One decision backend into every coding agent (MCP + Agent Skill)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AKTONAY" }]
keywords = ["llm", "mcp", "agents", "coding-agents", "cli", "jev", "kev", "laya", "system-one", "decisions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=2,<3",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2",
  "platformdirs>=4",
  "psutil>=5.9",
  "tomlkit>=0.13",
  "filelock>=3.13",
]

[project.urls]
Homepage = "https://github.com/aktonay/snapdec"
Documentation = "https://github.com/aktonay/snapdec#readme"
Repository = "https://github.com/aktonay/snapdec"
Changelog = "https://github.com/aktonay/snapdec/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/aktonay/snapdec/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# Installed ONLY into the managed runtime venv (Phase 2), never the base env:
runtime-onnx-cpu = ["onnxruntime>=1.19"]
runtime-onnx-dml = ["onnxruntime-directml>=1.19"]

[project.scripts]
snapdec = "snapdec.cli:app"

[tool.hatch.version]
path = "src/snapdec/_brand.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snapdec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["contract: MCP contract tests", "integration: daemon/integration tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
