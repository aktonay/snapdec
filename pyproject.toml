[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysone" # PLACEHOLDER — rename gate §1.4 of SYSONE_ARCHITECTURE.md (do not publish under this name)
dynamic = ["version"]
description = "Local System One decision layer for coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2",
  "platformdirs>=4",
  "psutil>=5.9",
  "tomlkit>=0.13",
  "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# Installed ONLY into the managed runtime venv (Phase 2), never the base env:
runtime-onnx-cpu = ["onnxruntime>=1.19"]
runtime-onnx-dml = ["onnxruntime-directml>=1.19"]

[project.scripts]
sysone = "sysone.cli:app"

[tool.hatch.version]
path = "src/sysone/_brand.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sysone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["contract: MCP contract tests", "integration: daemon/integration tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
